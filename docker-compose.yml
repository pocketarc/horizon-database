services:
  devtools:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/var/www/html
    tty: true
    stdin_open: true
    stop_grace_period: 1s
    depends_on:
      mysql:
        condition: service_healthy
      mariadb:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: horizon
      MYSQL_USER: root
      MYSQL_PASSWORD: password
      MARIADB_HOST: mariadb
      PGSQL_HOST: postgres
      PGSQL_DATABASE: horizon
      PGSQL_USER: horizon
      PGSQL_PASSWORD: password

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: horizon
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppassword"]
      interval: 3s
      timeout: 5s
      retries: 20
    stop_grace_period: 1s

  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: password
      MARIADB_DATABASE: horizon
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 20
    stop_grace_period: 1s

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: horizon
      POSTGRES_USER: horizon
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horizon -d horizon"]
      interval: 3s
      timeout: 5s
      retries: 20
    stop_grace_period: 1s
