name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sqlite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: [11, 12, 13]
        exclude:
          - php: '8.2'
            laravel: 13
    name: SQLite - PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, zip, pcntl, pdo, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: |
          composer require "illuminate/support:^${{ matrix.laravel }}.0" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - run: vendor/bin/phpunit

  mysql:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['mysql:8', 'mysql:5.7', 'mariadb:11']
    name: ${{ matrix.image }}
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: horizon
          MARIADB_ROOT_PASSWORD: password
          MARIADB_DATABASE: horizon
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, zip, pcntl, pdo, pdo_mysql
          coverage: none

      - run: composer update --prefer-dist --no-interaction --no-progress

      - run: vendor/bin/phpunit
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: horizon
          DB_USERNAME: root
          DB_PASSWORD: password

  postgres:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['postgres:16', 'postgres:14']
    name: ${{ matrix.image }}
    services:
      database:
        image: ${{ matrix.image }}
        env:
          POSTGRES_DB: horizon
          POSTGRES_USER: horizon
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U horizon -d horizon"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, zip, pcntl, pdo, pdo_pgsql
          coverage: none

      - run: composer update --prefer-dist --no-interaction --no-progress

      - run: vendor/bin/phpunit
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: horizon
          DB_USERNAME: horizon
          DB_PASSWORD: password

  quality:
    runs-on: ubuntu-latest
    name: Static analysis and style
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, zip, pcntl, pdo, pdo_sqlite
          coverage: none

      - run: composer update --prefer-dist --no-interaction --no-progress

      - run: vendor/bin/pint --test

      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
